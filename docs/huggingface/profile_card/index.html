<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Edmon Sahakyan · Armenian speech & dubbing</title>
  <style>
    :root { color-scheme: light dark; --fg: #1f2328; --bg: #ffffff; --muted: #59636e; --line: #d1d9e0; --link: #0969da; }
    @media (prefers-color-scheme: dark) { :root { --fg: #e6edf3; --bg: #0b0f19; --muted: #9198a1; --line: #30363d; --link: #4493f8; } }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 860px; margin: 0 auto; padding: 32px 20px 64px; }
    h1, h2, h3, strong, th, p, li, td, code { color: var(--fg); opacity: 1; }
    strong a, a strong { color: var(--link); }
    h1 { font-size: 2rem; margin-top: 0; }
    h2 { border-bottom: 1px solid var(--line); padding-bottom: .3em; margin-top: 2em; }
    a { color: var(--link); text-decoration: none; }
    a:hover { text-decoration: underline; }
    table { border-collapse: collapse; width: 100%; display: block; overflow-x: auto; }
    th, td { border: 1px solid var(--line); padding: 6px 12px; text-align: left; vertical-align: top; }
    th { background: color-mix(in srgb, var(--line) 35%, transparent); }
    code { background: color-mix(in srgb, var(--line) 45%, transparent); padding: .1em .35em; border-radius: 4px; }
    #error { color: var(--muted); }
  </style>
</head>
<body>
  <main id="content"><p id="error">Loading…</p></main>
  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
  <script>
    fetch("README.md")
      .then((r) => r.text())
      .then((md) => {
        const body = md.replace(/^---[\s\S]*?\n---\s*\n/, "");
        document.getElementById("content").innerHTML = marked.parse(body);
        document.querySelectorAll("#content a[href^='http']").forEach((a) => { a.target = "_blank"; a.rel = "noopener"; });
      })
      .catch(() => { document.getElementById("error").textContent = "Could not load README.md"; });
  </script>
</body>
</html>
